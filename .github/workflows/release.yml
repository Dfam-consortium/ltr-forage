name: Release

# After rmblast's release workflow: build each platform natively, package with `make dist`, smoke-test the
# packaged tree, and publish a GitHub Release whose description is the version's CHANGELOG.md section.

on:
  push:
    tags:
      # Both tag styles are accepted; the leading "v" is stripped when deriving VERSION.
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual trigger for a build-only smoke test: the archives are attached to the workflow run as artifacts,
  # and the release job is skipped (it is tag-gated).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        run: rustup update stable

      # Each runner builds natively for its own host, so no --target is passed and `make` finds the binary
      # where it expects it (target/release/).  Guard against building the wrong thing on the wrong runner.
      - name: Verify host triple matches the matrix target
        shell: bash
        run: |
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "${HOST}" != "${{ matrix.target }}" ]; then
            echo "runner host triple ${HOST} != matrix target ${{ matrix.target }}" >&2
            exit 1
          fi

      # The version of record is [package] version in Cargo.toml, which the Makefile stamps into the package
      # directory name.  A tag that disagrees with it would publish an archive whose name contradicts its contents.
      - name: Check tag against Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MAKE_VERSION="$(make version)"
          if [ "${TAG_VERSION}" != "${MAKE_VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} implies version ${TAG_VERSION}," >&2
            echo "but Cargo.toml [package] says ${MAKE_VERSION}." >&2
            echo "Bump Cargo.toml and re-tag, or tag the right commit." >&2
            exit 1
          fi

      # The release description comes from CHANGELOG.md, so catch a missing section before building.
      - name: Check CHANGELOG has a section for this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash .github/scripts/release_notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      # `make dist` runs the release build and stages the same versioned hierarchy that `make install` produces,
      # so the published archive and a local install are laid out identically.  COPYFILE_DISABLE keeps macOS tar
      # from injecting ._ AppleDouble entries.
      - name: Build and package
        shell: bash
        env:
          COPYFILE_DISABLE: '1'
        run: |
          make dist PREFIX=/staging DESTDIR="${PWD}/stage"
          VERSION="$(make version)"
          ARCHIVE="ltr-forage-${VERSION}-${{ matrix.target }}.tar.gz"
          mv "ltr-forage-${VERSION}.tar.gz" "${ARCHIVE}"
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      # The packaged binary must report the package version and the commit being released (build.rs); a build
      # from a tree with uncommitted changes ("-dirty", e.g. a Cargo.lock the build had to update) fails here.
      # It must also run: the tRNA scan of the example chromosome needs no index and no other program, and finds
      # 100 genes.  The driver must start from the packaged tree (its --help needs only Python).
      - name: Smoke-test the packaged tree
        shell: bash
        run: |
          VERSION="$(make version)"
          COMMIT="$(git rev-parse --short=7 HEAD)"
          PKG="stage/staging/ltr-forage-${VERSION}"
          OUT="$("${PKG}/bin/ltr-forage" --version)"
          echo "${OUT}"
          if [ "${OUT}" != "ltr-forage ${VERSION} (${COMMIT})" ]; then
            echo "ltr-forage reports '${OUT}', expected 'ltr-forage ${VERSION} (${COMMIT})'" >&2
            exit 1
          fi
          gzip -dc "${PKG}/examples/ath_chr4.fa.gz" > chr4.fa
          N="$("${PKG}/bin/ltr-forage" --trna-scan chr4.fa -t 2 | tail -n +2 | wc -l | tr -d ' ')"
          echo "tRNA genes on the example chromosome: ${N}"
          if [ "${N}" != "100" ]; then
            echo "expected 100 tRNA genes on examples/ath_chr4.fa.gz, found ${N}" >&2
            exit 1
          fi
          python3 "${PKG}/bin/ltr_library.py" --help > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/release_notes.sh "${GITHUB_REF_NAME#v}" > release_notes.md
          gh release create "${{ github.ref_name }}" \
            --title "ltr-forage ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            artifacts/*
