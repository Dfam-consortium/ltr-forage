[package]
name = "ltr-forage"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "ltr-forage"
path = "src/main.rs"

[dependencies]
libsufr = "0.8.0"
rmblast-lib = { git = "https://github.com/Dfam-consortium/RMBlast.git", tag = "3.0.12" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rayon = "1"
